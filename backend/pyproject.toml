[project]
name = "fitness-studio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "cryptography>=43",
  "alembic>=1.13",
  "pydantic-settings>=2.5",
  "langgraph>=1.0",
  "langgraph-checkpoint-redis",
  "langchain-google-genai",
  "google-genai",
  "redis>=5.2",
  "httpx>=0.27",
  "argon2-cffi>=23",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
app = ["data/*.json"]
